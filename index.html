<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Economist-style page shared with the English trainer: white paper, ink, one red accent.
   The unit of learning is a phrase in a situation, not a single word. */
:root{--bg:#FFFFFF;--soft:#F5F4F2;--line:#E3E1DC;--fg:#121212;--muted:#6B6B6B;--primary:#E3120B;--navy:#1F2E7A;--ok:#1E7B4A;--warn:#B7791F;--serif:'Source Serif 4',Georgia,serif;--sans:'Libre Franklin',-apple-system,Segoe UI,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--soft:#1C1C1C;--line:#2E2E2E;--fg:#EDEDED;--muted:#A3A3A3;--primary:#FF4D45;--navy:#8FA2FF;--ok:#4ADE80;--warn:#F6C453;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--soft:#1C1C1C;--line:#2E2E2E;--fg:#EDEDED;--muted:#A3A3A3;--primary:#FF4D45;--navy:#8FA2FF;--ok:#4ADE80;--warn:#F6C453;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-top:4px solid var(--primary);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.topin h1{font-family:var(--serif);font-size:1.1rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0}
.icon-btn svg{width:18px;height:18px}
.progress{height:3px;background:var(--line)}.progress>i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}
h2{font-family:var(--serif);font-weight:700;font-size:1.5rem;margin:16px 0 6px;line-height:1.2}
.eyebrow{font-weight:700;font-size:.78rem;color:var(--primary);letter-spacing:.03em;text-transform:uppercase;position:relative;padding-top:10px;margin-top:20px}
.eyebrow::before{content:"";position:absolute;top:0;left:0;width:32px;height:3px;background:var(--primary)}
.muted{color:var(--muted)}.small{font-size:.85rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;white-space:nowrap}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--fg);color:var(--bg)}
.hero{display:flex;gap:16px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:16px;margin-top:14px}
.ring{width:72px;height:72px;flex:none;position:relative}
.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.4rem;line-height:1}
.ring b small{font-family:var(--sans);font-size:.58rem;font-weight:600;color:var(--muted);margin-top:3px;text-transform:uppercase}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1}
.kpi b{display:block;font-family:var(--serif);font-size:1.5rem}.kpi span{font-size:.75rem;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:999px;padding:13px 18px;font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-align:center}
.btn.red{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.block{width:100%}
.btn.sm{min-height:0;padding:8px 14px;font-size:.85rem;flex:0 0 auto}
.btn:disabled{opacity:.4;cursor:default}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:left;padding:14px;display:flex;flex-direction:column;gap:3px;min-height:92px;position:relative}
.tile::before{content:"";width:24px;height:3px;background:var(--primary);margin-bottom:8px}
.tile h3{font-family:var(--serif);font-size:1.02rem;margin:0}.tile p{margin:0;font-size:.78rem;color:var(--muted)}
.tile .bar{height:3px;background:var(--line);margin-top:auto;border-radius:2px;overflow:hidden}.tile .bar i{display:block;height:100%;background:var(--ok)}
.tile:active,.opt:active,.btn:active{transform:scale(.98)}
.card{border:1px solid var(--line);border-radius:6px;padding:20px;margin-top:14px}
.cue{font-size:1.15rem;font-weight:600;line-height:1.4}
.nl{font-family:var(--serif);font-size:clamp(1.45rem,6.4vw,1.9rem);font-weight:700;line-height:1.3;word-break:break-word}
mark{background:none;color:var(--primary);border-bottom:2px solid var(--primary)}
.ru{font-size:1.02rem;color:var(--muted);margin-top:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--muted);background:transparent}
button.tag{cursor:pointer}
.note{margin-top:12px;padding:12px 14px;background:var(--soft);border-radius:6px;font-size:.92rem;line-height:1.5}
.note b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-bottom:3px}
.note i{font-family:var(--serif)}
.row{display:flex;gap:8px;align-items:center;margin-top:14px}
.row .btn{flex:1}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.grades button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:10px 4px;font-weight:700;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.grades button small{font-weight:500;color:var(--muted);font-size:.7rem}
.grades .g1{color:var(--primary)}.grades .g4{color:var(--ok)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:14px 16px;text-align:left;font-size:1rem}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.opt.bad{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent)}
.big-say{width:84px;height:84px;border-radius:50%;border:2px solid var(--fg);background:transparent;display:flex;align-items:center;justify-content:center;margin:8px auto 0}
.big-say svg{width:34px;height:34px}.big-say.on{background:var(--fg);color:var(--bg)}
input[type=text],textarea{width:100%;font:inherit;font-size:1.08rem;border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:6px;padding:13px;margin-top:14px}
textarea{font-size:.85rem;min-height:120px;font-family:ui-monospace,monospace}
input[type=text]:focus,textarea:focus{outline:2px solid var(--fg);background:var(--bg)}
.zone{min-height:60px;border:1.5px dashed var(--line);border-radius:6px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;align-content:flex-start}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tk{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:9px 12px;font-size:1rem;font-weight:500}
.zone .tk{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.diff span{display:inline-block;margin:2px 3px 2px 0;padding:1px 4px;border-radius:3px}
.diff .ok{color:var(--ok)}.diff .no{color:var(--primary);text-decoration:underline}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:3px solid var(--ok);box-shadow:0 -10px 30px rgba(0,0,0,.12);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);visibility:hidden;transition:transform .25s,visibility .25s}
.sheet.show{transform:none;visibility:visible}.sheet.bad{border-top-color:var(--primary)}.sheet.mid{border-top-color:var(--warn)}
.sheet .in{max-width:640px;margin:0 auto}
.sheet h4{margin:0 0 4px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.sheet.good h4{color:var(--ok)}.sheet.bad h4{color:var(--primary)}.sheet.mid h4{color:var(--warn)}
.sheet .ans{font-family:var(--serif);font-size:1.15rem;margin-bottom:4px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.sheet .tr{font-size:.9rem;color:var(--muted);margin-bottom:12px}
.list .it{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it>div{flex:1;min-width:0}
.list .w{font-family:var(--serif);font-weight:600;font-size:1.05rem}.list .e{font-size:.88rem;color:var(--muted);margin-top:2px}
.say{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.say svg{width:16px;height:16px}.say.on{background:var(--fg);color:var(--bg)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--line);margin-right:6px;vertical-align:middle}
.dot.l{background:var(--primary)}.dot.r{background:var(--warn)}.dot.m{background:var(--ok)}
.menu{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:none;align-items:flex-end}
.menu.show{display:flex}
.menu .box{background:var(--bg);width:100%;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-radius:12px 12px 0 0}
.menu .box .btn{margin-top:8px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set label{font-weight:600}.set small{display:block;color:var(--muted);font-weight:400}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.warnbox{border:1px solid var(--warn);color:var(--fg);border-radius:6px;padding:10px 12px;font-size:.85rem;margin-top:12px}
/* chat bubbles for dialogues (Duolingo Stories style) */
.chat{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.bub{max-width:86%;padding:10px 13px;border-radius:14px;font-family:var(--serif);font-size:1.08rem;line-height:1.4;cursor:pointer}
.bub small{display:none;font-family:var(--sans);font-size:.82rem;color:var(--muted);margin-top:4px}
.bub.tr small,.chat.tr .bub small{display:block}
.bub.a{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--fg);color:var(--bg);border-bottom-right-radius:4px}
.bub.me small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.who{font-family:var(--sans);font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.timer{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:12px}.timer i{display:block;height:100%;background:var(--primary);transition:width 1s linear}
.combo{font-weight:700;color:var(--ok);font-size:.85rem}
.tile .badge{position:absolute;top:12px;right:12px;font-size:.72rem;font-weight:700;color:var(--primary)}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;font-weight:600;z-index:60;display:none;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <button class="icon-btn" id="b-back" aria-label="Back" style="visibility:hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>

</div></div>

<script id="deck" type="application/json">{"version":1,"scenes":[{"id":"greet","en":"Greetings","nl":"Begroeten","ru":"Приветствия и знакомство"},{"id":"zelf","en":"About you","nl":"Over jezelf","ru":"Работа, семья, где живёте, хобби"},{"id":"smalltalk","en":"Weather & weekend","nl":"Het weer","ru":"Погода, выходные, отпуск"},{"id":"buren","en":"Neighbours","nl":"De buren","ru":"Соседи: посылки, шум, просьбы"},{"id":"cafe","en":"Café","nl":"In het café","ru":"Заказать, оплатить, уточнить"},{"id":"winkel","en":"Shopping","nl":"In de winkel","ru":"Супермаркет, сыр, пекарня, одежда"},{"id":"ov","en":"Getting around","nl":"Onderweg","ru":"Поезд, трамвай, велосипед"},{"id":"straat","en":"On the street","nl":"Op straat","ru":"Дорога, просьбы, извинения"},{"id":"kind_thuis","en":"Child at home","nl":"Thuis met je kind","ru":"Еда, сон, сборы, похвала"},{"id":"kind_buiten","en":"Child outside","nl":"Buiten en op school","ru":"Улица, площадка, школа"},{"id":"feestje","en":"Birthday party","nl":"Op een verjaardag","ru":"Поздравить, угоститься, попрощаться"},{"id":"werk","en":"Colleagues","nl":"Op het werk","ru":"Small talk у кофемашины"},{"id":"plan","en":"Making plans","nl":"Afspreken","ru":"Договориться, перенести, отменить"},{"id":"telefoon","en":"Phone calls","nl":"Aan de telefoon","ru":"Представиться, переспросить, перезвонить"},{"id":"dokter","en":"Doctor & pharmacy","nl":"Huisarts en apotheek","ru":"Записаться, симптомы, лекарства"},{"id":"huis","en":"Home & deliveries","nl":"Thuis: storing en bezorging","ru":"Поломки, мастер, курьер, ключи"},{"id":"sport","en":"Sport & free time","nl":"Sport en vrije tijd","ru":"Спортзал, клуб ребёнка, матч"},{"id":"reageren","en":"Reactions","nl":"Reageren","ru":"Короткие реакции в разговоре"},{"id":"herstel","en":"Not understood?","nl":"Niet begrepen?","ru":"Переспросить, уточнить, выиграть время"}],"gram":{"V2":{"t":"Verb second","ru":"Глагол всегда на 2-м месте. Если фраза начинается не с подлежащего, подлежащее встаёт после глагола.","ex":"Morgen werk ik thuis."},"bijzin":{"t":"Sub-clause","ru":"После dat, als, omdat, wanneer, of глагол уходит в конец придаточного.","ex":"Ik bel je als ik er ben."},"perf":{"t":"Perfect tense","ru":"Разговорное прошедшее: hebben/zijn + причастие в конце. zijn с движением и сменой состояния.","ex":"We zijn thuis gebleven."},"scheid":{"t":"Separable verbs","ru":"Приставка уходит в конец фразы; в инфинитиве и причастии снова слитно.","ex":"Oma haalt hem op. → opgehaald"},"modaal":{"t":"Modal + infinitive","ru":"kunnen, mogen, willen, moeten + инфинитив в самом конце.","ex":"Mag ik uw boormachine even lenen?"},"er":{"t":"Er","ru":"er = «там», «есть» (Is er…?) или вместо «это» с предлогом (eraan, eruit). Учите в составе фраз.","ex":"Zitten er noten in?"},"omte":{"t":"Om … te","ru":"om … te + инфинитив: «чтобы», а также после tijd, te nat и т.п.","ex":"Het is tijd om te slapen."},"imp":{"t":"Imperative","ru":"Повелительное = основа глагола. Смягчают maar, even, eens, alsjeblieft.","ex":"Trek je jas maar aan."},"vraag":{"t":"Questions","ru":"В вопросе глагол первым или сразу после вопросительного слова. Перед je/jij у глагола отпадает -t.","ex":"Heb je dorst? Woont u hier al lang?"},"gaan":{"t":"Future with gaan","ru":"Будущее в разговоре: gaan + инфинитив в конце.","ex":"Wat ga je vanavond doen?"},"dim":{"t":"Diminutives","ru":"-je, -tje, -pje: всегда het. Очень частые в речи и смягчают тон.","ex":"een stukje appeltaart, momentje"},"wederk":{"t":"Reflexive verbs","ru":"Возвратные местоимения: me, je, zich, ons, jullie.","ex":"Ik heb me goed vermaakt."},"neg":{"t":"Geen / niet","ru":"geen перед существительным без определённого артикля, niet во всех остальных случаях.","ex":"Ik hoef geen tas. Ik ben niet bekend."},"chunk":{"t":"Fixed phrase","ru":"Устойчивое выражение: учите целиком, без разбора.","ex":"Laat maar zitten."}},"items":[{"id":"gr01","scene":"greet","lvl":"A1","gram":"vraag","cue_ru":"Поздороваться утром и спросить, как дела","nl":"Goedemorgen! Hoe gaat <script>
(function(){
'use strict';
/* ======================= DATA ======================= */
var DECK=JSON.parse(document.getElementById('deck').textContent);
var K={cards:'pm.cards.v1',cfg:'pm.cfg.v1',log:'pm.log.v1',mine:'pm.mine.v1'};
var DAY=86400000;
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Storage is full or blocked')}}};
var cfg=Object.assign({lessonNew:10,dailyGoal:30,retention:.9,autoSpeak:true,sounds:true,rate:.85,theme:'',focus:[]},store.get(K.cfg,{}));
var cards=store.get(K.cards,{});          // key "itemId:say" | "itemId:listen"
var log=store.get(K.log,{});['days','newDone','rev','xp','miss','best','dlg'].forEach(function(k){log[k]=log[k]||{}});
var mine=store.get(K.mine,[]);
function saveCfg(){store.set(K.cfg,cfg)}function saveCards(){store.set(K.cards,cards)}function saveLog(){store.set(K.log,log)}
if(cfg.theme)document.documentElement.dataset.theme=cfg.theme;

var SCENES=DECK.scenes.slice(),SC={},ITEMS=[],BYID={};
function rebuild(){
  ITEMS=DECK.items.slice();SCENES=DECK.scenes.slice();
  if(mine.length){SCENES.push({id:'mine',en:'My words',nl:'Mijn woorden',ru:'Из ваших текстов'});ITEMS=ITEMS.concat(mine)}
  SC={};SCENES.forEach(function(s,i){s.i=i;SC[s.id]=s});BYID={};ITEMS.forEach(function(x){BYID[x.id]=x});
}
rebuild();

/* ======================= HELPERS ======================= */
var $=function(id){return document.getElementById(id)};
var app=$('app');
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return dkey()}
function sod(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function norm(s){return String(s||'').toLowerCase().normalize('NFC').replace(/[’‘]/g,"'").replace(/[^\p{L}\p{N}' ]+/gu,' ').replace(/\s+/g,' ').trim()}
function squash(s){return norm(s).replace(/[\s']/g,'')}
function lev(a,b){if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;var p=[],i,j;for(j=0;j<=b.length;j++)p[j]=j;for(i=1;i<=a.length;i++){var prev=p[0];p[0]=i;for(j=1;j<=b.length;j++){var t=p[j];p[j]=a[i-1]===b[j-1]?prev:1+Math.min(prev,p[j],p[j-1]);prev=t}}return p[b.length]}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2400)}
function setProg(p){$('prog').style.width=Math.max(0,Math.min(100,p))+'%'}
var SAY_ICO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
function sayBtn(t){return '<button class="say" data-say="'+esc(t)+'" aria-label="Listen">'+SAY_ICO+'</button>'}
function sceneName(id){var s=SC[id];return s?s.en:id}
/* highlight the key chunk inside the sentence (exact, else a shared stem for imported words) */
function chunkRange(it){var nl=it.nl,c=it.chunk||'';if(!c)return null;var i=nl.toLowerCase().indexOf(c.toLowerCase());if(i>-1)return[i,c.length];
  var stem=c.toLowerCase().split(/\s+/)[0].replace(/(en|e|t|n)$/,'');if(stem.length<3)return null;var m=nl.toLowerCase().match(new RegExp('(^|[^\\p{L}])('+stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\p{L}*)','u'));return m?[m.index+m[1].length,m[2].length]:null}
function nlHTML(it){var r=chunkRange(it);if(!r)return esc(it.nl);return esc(it.nl.slice(0,r[0]))+'<mark>'+esc(it.nl.substr(r[0],r[1]))+'</mark>'+esc(it.nl.slice(r[0]+r[1]))}
function gramNote(it){var g=DECK.gram[it.gram];if(!g||it.gram==='chunk'&&it.scene==='mine')return '';return '<div class="note"><b>'+esc(g.t)+'</b>'+esc(g.ru)+'<br><i>'+esc(g.ex)+'</i></div>'}

/* ======================= SPEECH (on-device, no external API) ======================= */
var VOICE=null,HASVOICE=false,CANSPEAK='speechSynthesis' in window;
function pickVoice(){try{var v=speechSynthesis.getVoices().filter(function(x){return /^nl/i.test(x.lang)});HASVOICE=v.length>0;VOICE=v.filter(function(x){return /nl[-_]NL/i.test(x.lang)&&/natural|google|premium|enhanced|online|siri/i.test(x.name)})[0]||v.filter(function(x){return /nl[-_]NL/i.test(x.lang)})[0]||v[0]||null}catch(e){}}
if(CANSPEAK){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t,btn,rate){if(!CANSPEAK||!t)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='nl-NL';u.rate=rate||cfg.rate;if(VOICE)u.voice=VOICE;if(btn){btn.classList.add('on');u.onend=u.onerror=function(){btn.classList.remove('on')}}speechSynthesis.speak(u)}catch(e){}}
function auto(t){if(cfg.autoSpeak)speak(t)}
document.addEventListener('click',function(e){var b=e.target.closest('[data-say]');if(b){e.stopPropagation();speak(b.dataset.say,b,b.dataset.slow?.6:0)}},true);

/* ======================= FSRS-5 scheduler ======================= */
/* Default FSRS-5 weights. Interval targets the chosen probability of recall (cfg.retention). */
var W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
var DECAY=-0.5,FACTOR=19/81;
var clamp=function(x,a,b){return Math.min(b,Math.max(a,x))};
function retr(t,s){return Math.pow(1+FACTOR*t/s,DECAY)}
function ivl(s){return clamp(Math.round(s/FACTOR*(Math.pow(cfg.retention,1/DECAY)-1)),1,1095)}
function d0(g){return clamp(W[4]-Math.exp(W[5]*(g-1))+1,1,10)}
function nextState(c,g,now){
  now=now||Date.now();var n;
  if(!c){n={s:W[g-1],d:d0(g),reps:0,lapses:0}}
  else{
    var t=Math.max(0,(now-c.last)/DAY),r=retr(t,c.s),d2=c.d-W[6]*(g-3);d2=c.d+(d2-c.d)*(10-c.d)/9;var d=clamp(W[7]*d0(4)+(1-W[7])*d2,1,10),s;
    if(t<1)s=c.s*Math.exp(W[17]*(g-3+W[18]));
    else if(g===1)s=Math.min(c.s,W[11]*Math.pow(c.d,-W[12])*(Math.pow(c.s+1,W[13])-1)*Math.exp((1-r)*W[14]));
    else s=c.s*(1+Math.exp(W[8])*(11-c.d)*Math.pow(c.s,-W[9])*(Math.exp((1-r)*W[10])-1)*(g===2?W[15]:1)*(g===4?W[16]:1));
    n={s:Math.max(.1,s),d:d,reps:c.reps,lapses:c.lapses+(g===1?1:0)};
  }
  n.reps++;n.last=now;
  n.due=g===1?now+10*60000:sod()+ivl(n.s)*DAY+4*3600000;
  return n;
}
function previewDays(c,g){if(g===1)return '10m';var d=ivl(nextState(c,g).s);return d>=60?Math.round(d/30)+'mo':d+'d'}
function grade(key,g){
  var c=cards[key];if(!c){var d=today();log.newDone[d]=log.newDone[d]||[];if(log.newDone[d].indexOf(key.split(':')[0])<0)log.newDone[d].push(key.split(':')[0])}
  var r=log.rev[today()]||(log.rev[today()]={n:0,fail:0});r.n++;if(g===1)r.fail++;
  cards[key]=nextState(c,g);saveCards();markDay();
}
function markDay(){log.days[today()]=(log.days[today()]||0)+1;saveLog()}
function newLeft(){return cfg.lessonNew}
function newToday(){return (log.newDone[today()]||[]).length}
function xpToday(){return log.xp[today()]||0}
function addXP(n){log.xp[today()]=(log.xp[today()]||0)+n;markDay()}
/* short feedback sounds made on the device (no files, no network) */
var AC=null;
function beep(ok){if(cfg.sounds){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.connect(g);g.connect(AC.destination);
  if(ok){o.type='sine';o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.09)}else{o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.setValueAtTime(160,t+.1)}
  g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.26)}catch(e){}}
  if(!ok&&navigator.vibrate)try{navigator.vibrate(50)}catch(e){}}
function streak(){var n=0,d=new Date();if(!log.days[today()])d.setDate(d.getDate()-1);while(log.days[dkey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function itemCards(id){return[cards[id+':say'],cards[id+':listen']]}
function isNewItem(it){return !cards[it.id+':say']&&!cards[it.id+':listen']}
function itemStatus(it){var c=itemCards(it.id).filter(Boolean);if(!c.length)return 'n';var s=Math.min.apply(null,c.map(function(x){return x.s}));return s>=21&&c.length===2?'m':(c.some(function(x){return x.due<Date.now()+DAY})&&s<3?'l':'r')}
function dueKeys(){var now=Date.now();return Object.keys(cards).filter(function(k){return cards[k].due<=now&&BYID[k.split(':')[0]]}).sort(function(a,b){return cards[a].due-cards[b].due})}

/* ======================= SESSION ENGINE ======================= */
/* A session is a queue of steps; each renders one screen and ends with done(). practice=true leaves the schedule untouched. */
var S=null;
function startSession(name,steps,practice,again,opts){if(!steps.length){toast('Nothing to practise here yet');return}hideMenu();S={again:again,mistakes:opts&&opts.mistakes,combo:0,name:name,steps:steps,i:0,scored:-1,ok:0,bad:0,seen:{},miss:{},practice:!!practice,requeued:{}};$('title').textContent=name;$('b-back').style.visibility='visible';runStep()}
function runStep(){hideSheet();if(!S)return;if(S.i>=S.steps.length)return finish();setProg(S.i/S.steps.length*100);window.scrollTo(0,0);S.steps[S.i]()}
function next(){if(!S)return;S.i++;runStep()}
function nextFrom(i,ms){setTimeout(function(){if(S&&S.i===i)next()},ms)}
/* auto-graded exercises map to FSRS: clean first try = Good, needed help = Hard, failed = Again */
function score(key,it,g,ans){if(!S||S.scored===S.i)return;S.scored=S.i;app.querySelectorAll('.grades button,.opt').forEach(function(b){b.disabled=true});
  beep(g>=3);if(g>=3){S.combo++;addXP(1)}else S.combo=0;
  if(g<=2)log.miss[it.id]=Date.now();else if(S.mistakes)delete log.miss[it.id];saveLog();S.seen[it.id]=1;if(g>=3)S.ok++;else S.bad++;if(g===1)S.miss[it.id]=1;
  if(!S.practice&&key)grade(key,g);
  if(g===1&&key&&!S.requeued[key]){S.requeued[key]=1;var t=key.split(':')[1];S.steps.push(t==='say'?function(){exBuild(key,it)}:function(){exHearChoose(key,it)})}
  if(ans===false)return nextFrom(S.i,g>=3?500:900);
  showSheet(g,it)}
function showSheet(g,it){var s=$('sheet');s.className='sheet show '+(g>=3?'good':g===2?'mid':'bad');$('sh-h').innerHTML=(g>=3?'Correct':g===2?'Almost':'Not quite')+(g>=3&&S&&S.combo>=3?' <span class="combo">· '+S.combo+' in a row</span>':'');
  $('sh-a').innerHTML='<span>'+nlHTML(it)+'</span>'+sayBtn(it.nl);$('sh-t').textContent=it.ru;auto(it.nl);setTimeout(function(){$('sh-next').focus()},50)}
function hideSheet(){$('sheet').className='sheet'}
$('sh-next').onclick=next;
function finish(){
  hideSheet();var n=Object.keys(S.seen).length,acc=S.ok+S.bad?Math.round(100*S.ok/(S.ok+S.bad)):100,miss=Object.keys(S.miss).map(function(id){return BYID[id]}).filter(Boolean);
  if(S.practice&&S.ok+S.bad)markDay();

    else{var toks=l.nl.split(/\s+/).map(function(t){return t.replace(/[.,!?]+$/,'')}),pool=shuffle(toks.map(function(t,k){return{t:t,k:k}})),picked=[],tries=0;

  step();
}

/* lines from Germanic Read to Learn "Copy TSV": base \t definition \t example \t category */
function importMine(text){var n=0,have={};mine.forEach(function(m){have[m.id]=1});
  text.split(/\r?\n/).forEach(function(line){var c=line.split('\t');if(c.length<2||!c[0].trim()||!c[1].trim())return;
    var base=c[0].trim(),term=base.replace(/\([^)]*\)/g,'').split(',')[0].replace(/^(de|het)\s+/i,'').trim(),ex=(c[2]||'').trim(),id='my:'+squash(term);if(have[id]||!term)return;have[id]=1;
    mine.push({id:id,scene:'mine',lvl:'',gram:'chunk',cue_ru:'Скажите: '+c[1].trim(),nl:ex||base.replace(/\([^)]*\)/g,'').trim(),ru:c[1].trim()+(ex?'':''),chunk:term,alt:[]});n++});
  store.set(K.mine,mine);rebuild();return n}
